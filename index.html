<style>
  :root{
    --navy-deep: #0c1030;
    --navy-mid: #171c46;
    --navy-glow: #2a2f6e;
    --gold: #f0b93d;
    --gold-soft: #f7d478;
    --purple: #6a2f7d;
    --orange: #e5711f;
    --cream: #f4ecd8;
    --blue-team: #2f6fed;
    --blue-team-dark: #1c4bb0;
    --red-team: #d1461f;
    --red-team-dark: #98300f;
    --ink: #eef1ff;
    --muted: #9aa0c9;
    --good:#3fae5e;
  }
  *{box-sizing:border-box;}
  html{
    overscroll-behavior: none;
  }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 20%, var(--navy-glow) 0%, var(--navy-mid) 45%, var(--navy-deep) 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    padding: 24px 16px 60px;
    overscroll-behavior: none;
  }
  h1{
    font-family: Impact, 'Arial Black', sans-serif;
    text-align:center;
    letter-spacing: 3px;
    font-size: clamp(26px, 5vw, 42px);
    margin: 0 0 4px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold) 55%, #a9720c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .subtitle{ text-align:center; color: var(--muted); font-size: 13px; margin-bottom: 22px; letter-spacing: 0.5px; }
  .layout{ display:grid; grid-template-columns: minmax(320px, 620px) minmax(280px, 380px); gap: 24px; max-width: 1080px; margin: 0 auto; align-items:start; }
  @media (max-width: 860px){ .layout{grid-template-columns: 1fr;} }
  .board-card{ background: linear-gradient(160deg, #11153a, #090c26); border-radius: 20px; padding: 14px; border: 3px solid var(--gold); box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 0 40px rgba(240,185,61,0.06); }
  svg{display:block; width:100%; height:auto;}
  .panel{ background: rgba(23,28,70,0.6); border: 1px solid rgba(240,185,61,0.25); border-radius: 16px; padding: 18px; margin-bottom: 18px; backdrop-filter: blur(4px); }
  .panel h2{ font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold-soft); margin: 0 0 12px; font-weight: 700; }
  .team-row{ display:flex; align-items:center; justify-content:space-between; padding: 8px 10px; border-radius: 10px; margin-bottom: 8px; }
  .team-row.blue{background: rgba(47,111,237,0.15); border:1px solid rgba(47,111,237,0.4);}
  .team-row.red{background: rgba(209,70,31,0.15); border:1px solid rgba(209,70,31,0.4);}
  .team-name{display:flex; align-items:center; gap:8px; font-weight:600;}
  .dot{width:14px; height:14px; border-radius:50%; display:inline-block;}
  .dot.blue{background: var(--blue-team);}
  .dot.red{background: var(--red-team);}
  .team-pos{font-variant-numeric: tabular-nums; font-size:14px; color: var(--ink);}
  .turn-banner{ text-align:center; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 15px; margin-bottom: 14px; letter-spacing: 0.3px; }
  .turn-banner.blue{background: linear-gradient(135deg, var(--blue-team), var(--blue-team-dark)); color:#fff;}
  .turn-banner.red{background: linear-gradient(135deg, var(--orange), var(--red-team-dark)); color:#fff;}
  .field-label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; display:block; }
  input[type=number], input[type=text]{ width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(240,185,61,0.4); background: rgba(9,12,38,0.6); color: var(--ink); font-size: 16px; margin-bottom: 12px; }
  select{ width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(240,185,61,0.4); background: rgba(9,12,38,0.6); color: var(--ink); font-size: 14px; margin-bottom: 12px; }
  input:focus, select:focus{ outline: 2px solid var(--gold); outline-offset:1px; }
  button{ width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #2a1c00; font-weight: 700; font-size: 14px; cursor: pointer; letter-spacing: 0.3px; transition: transform 0.1s ease, box-shadow 0.1s ease; }
  button:hover{transform: translateY(-1px); box-shadow: 0 6px 14px rgba(240,185,61,0.35);}
  button:active{transform: translateY(0);}
  button.secondary{ background: rgba(240,185,61,0.12); color: var(--gold-soft); border: 1px solid rgba(240,185,61,0.4); margin-top: 8px; }
  button.danger{ background: linear-gradient(135deg, #e5734a, #b8351a); color:#fff; }
  button.choice-purple{ background: linear-gradient(135deg, #8a45a0, var(--purple)); color:#fff; margin-bottom:10px;}
  button.choice-orange{ background: linear-gradient(135deg, #f3903f, var(--orange)); color:#fff; }
  .hint{ font-size: 12px; color: var(--muted); margin: -6px 0 12px; line-height:1.4; }
  .log{ max-height: 200px; overflow-y: auto; font-size: 12.5px; color: var(--muted); display:flex; flex-direction: column; gap: 6px; }
  .log div{ padding: 6px 8px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid rgba(240,185,61,0.4); }
  details{ font-size: 12.5px; color: var(--muted); }
  details summary{ cursor:pointer; color: var(--gold-soft); font-weight:600; margin-bottom:8px; }
  .legend{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 8px; }
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-swatch{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .correction-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .correction-row button{width:auto; padding:6px 12px; font-size:12px;}
  .correction-row span{flex:1; text-align:center; font-size:13px;}
  .win-banner{ text-align:center; padding: 16px; border-radius: 14px; font-family: Impact, 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 14px; background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #2a1c00; }
  .gate{ text-align:center; padding: 24px 16px; border-radius: 14px; background: rgba(197,45,45,0.12); border: 2px dashed rgba(229,71,31,0.6); margin-bottom:14px; }
  .gate .big-warn{ font-family: Impact, 'Arial Black', sans-serif; font-size:18px; color:#ff9d7a; margin-bottom:10px; letter-spacing:0.5px; }
  .card-topic{ font-family: Impact, 'Arial Black', sans-serif; font-size: 22px; text-align:center; margin-bottom:14px; padding:12px; border-radius:12px; background: rgba(240,185,61,0.1); border:1px solid rgba(240,185,61,0.35); color: var(--gold-soft); letter-spacing:0.5px; }
  .answer-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; margin-bottom:6px; background: rgba(255,255,255,0.03); cursor:pointer; user-select:none; transition: background 0.15s ease; }
  .answer-row:hover{ background: rgba(255,255,255,0.07); }
  .answer-row.checked{ background: rgba(63,174,94,0.18); border:1px solid rgba(63,174,94,0.5); }
  .answer-row.missed{ background: rgba(229,71,31,0.12); border:1px solid rgba(229,71,31,0.4); }
  .answer-row .box{ width:20px; height:20px; border-radius:5px; border:2px solid var(--gold-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color: var(--good); }
  .answer-row .box.missed-box{ border-color: rgba(229,71,31,0.7); color:#e5471f; }
  .answer-row span.txt{ font-size:14px; flex:1; }
  .tally{ text-align:center; font-family: Impact, 'Arial Black', sans-serif; font-size:26px; color: var(--good); margin: 8px 0 14px; }
  .mode-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .mode-tabs button{ flex:1; }
  .mode-tabs button.inactive{ background: rgba(240,185,61,0.1); color: var(--gold-soft); border:1px solid rgba(240,185,61,0.3); }
  .setup-card{ max-width:520px; margin:0 auto; }
  .team-name-input{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .team-name-input .dot{ width:18px; height:18px; flex-shrink:0; }
  .result-box{ text-align:center; padding:18px; border-radius:14px; margin-bottom:14px; }
  .result-box.win{ background: rgba(63,174,94,0.15); border:1px solid rgba(63,174,94,0.5); }
  .result-box.lose{ background: rgba(229,71,31,0.15); border:1px solid rgba(229,71,31,0.5); }
  .result-box .big{ font-family: Impact, 'Arial Black', sans-serif; font-size:28px; margin-bottom:6px; }
</style>
</head>

const SEGMENTS = [
  {type:'start'},
  {type:'run', count:8, start:'purple'},
  {type:'spiral'},
  {type:'run', count:9, start:'purple'},
  {type:'spiral'},
  {type:'run', count:8, start:'orange'},
  {type:'spiral'},
  {type:'run', count:7, start:'orange'},
  {type:'question'},
  {type:'run', count:6, start:'purple'},
  {type:'question'},
  {type:'run', count:5, start:'purple'},
  {type:'question'},
  {type:'run', count:4, start:'orange'},
  {type:'question'},
  {type:'run', count:3, start:'orange'},
  {type:'question'},
  {type:'run', count:5, start:'purple'},
  {type:'finish'}
];
function buildTrack(){
  const track = [];
  SEGMENTS.forEach(seg=>{
    if(seg.type==='run'){
      let color = seg.start;
      for(let k=0;k<seg.count;k++){
        track.push({type:'normal', color});
        color = (color==='purple') ? 'orange' : 'purple';
      }
    } else {
      track.push({type: seg.type});
    }
  });
  return track;
}
const TRACK = buildTrack();
const TOTAL = TRACK.length;

const CX = 300, CY = 300, MAXR = 262, MINR = 58, TURNS = 3.3;
const TOTAL_ANGLE = TURNS * 2 * Math.PI;
function cellPoint(i){
  const t = i/(TOTAL-1);
  const angle = -Math.PI/2 + t*TOTAL_ANGLE;
  const radius = MAXR - t*(MAXR-MINR);
  return { x: CX + radius*Math.cos(angle), y: CY + radius*Math.sin(angle) };
}
function buildSpiralPath(){
  const steps = 500; let d = '';
  for(let s=0;s<=steps;s++){
    const t = s/steps;
    const angle = -Math.PI/2 + t*TOTAL_ANGLE;
    const radius = MAXR - t*(MAXR-MINR);
    const x = CX + radius*Math.cos(angle);
    const y = CY + radius*Math.sin(angle);
    d += (s===0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
  }
  return d;
}
function typeFill(cell){
  if(cell.type==='start') return 'var(--gold)';
  if(cell.type==='finish') return 'var(--gold)';
  if(cell.type==='question') return 'var(--cream)';
  if(cell.type==='spiral') return '#2fb6c9';
  return cell.color==='purple' ? 'var(--purple)' : 'var(--orange)';
}

const ROOMS_COLLECTION = 'tension_rooms';
const SESSION_KEY = 'tension_session_v1';
const LOCAL_SAVE_KEY = 'tension_local_game_v1';

let conn = {
  mode: 'local',      // 'local' | 'online'
  role: null,         // null (egy eszközön) | 'blue' | 'red'
  roomCode: null,
  status: 'idle',      // idle | connecting | connected | waiting_partner | error
  errorMsg: null,
  unsubscribe: null,
  partnerPresent: false
};

let applyingRemote = false;
let lastPushedJSON = null;

function generateRoomCode(){ return String(Math.floor(1000 + Math.random()*9000)); }

function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({ roomCode: conn.roomCode, role: conn.role }));
  }catch(e){}
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

function saveLocalGame(){
  if(conn.mode === 'online') return; // az online módot a Firestore session kezeli
  if(!state || state.screen !== 'game') return;
  try{ localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadLocalGame(){
  try{
    const raw = localStorage.getItem(LOCAL_SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearLocalGame(){
  try{ localStorage.removeItem(LOCAL_SAVE_KEY); }catch(e){}
}
// Egységes "mentsd el az állapotot, bárhogy is játszunk" hívás
function persistState(){
  if(conn.mode === 'online') pushState();
  else saveLocalGame();
}

function roomRef(code){ return db.collection(ROOMS_COLLECTION).doc(code); }

function subscribeRoom(code){
  if(conn.unsubscribe) conn.unsubscribe();
  conn.unsubscribe = roomRef(code).onSnapshot((doc)=>{
    if(!doc.exists) return;
    const data = doc.data();
    conn.partnerPresent = !!(data.claimedRoles && data.claimedRoles.blue && data.claimedRoles.red);
    if(conn.status === 'connecting' || conn.status === 'waiting_partner'){
      conn.status = conn.partnerPresent ? 'connected' : 'waiting_partner';
    }
    if(data.state){
      const incomingJSON = JSON.stringify(data.state);
      if(incomingJSON !== lastPushedJSON){
        applyingRemote = true;
        state = data.state;
        applyingRemote = false;
        render();
        if(state.screen === 'game'){
          if(state.mode === 'full'){
            if(state.phase === 'playing' && !timerInterval){
              startTimer(iAmReader());
            } else if(state.phase !== 'playing' && timerInterval){
              stopTimer();
            }
          } else { // tracker mód
            const remaining = computeRemaining();
            if(state.trackerTimerEnabled && state.timerEndsAt && remaining > 0 && !timerInterval){
              startTimer(false);
            } else if((!state.trackerTimerEnabled || !state.timerEndsAt || remaining <= 0) && timerInterval){
              stopTimer();
            }
          }
        }
      }
    }
    if(conn.status !== 'error') render();
  }, (err)=>{
    conn.status = 'error';
    conn.errorMsg = 'Kapcsolati hiba a szerverrel: ' + (err && err.message ? err.message : 'ismeretlen hiba');
    render();
  });
}

function pushState(){
  if(conn.mode !== 'online' || !conn.roomCode || applyingRemote) return;
  lastPushedJSON = JSON.stringify(state);
  roomRef(conn.roomCode).set({
    state: state,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(()=>{ /* átmeneti hálózati hiba, a következő akciónál újra próbálkozunk */ });
}
// A kör-funkciók a persistState()-et hívják (lásd feljebb), ami online és
// egy eszközös módban is elmenti az állapotot.

async function createRoomFirestore(code, role){
  conn.mode = 'online'; conn.role = role; conn.roomCode = code;
  conn.status = 'connecting'; conn.errorMsg = null;
  render();
  try{
    await db.runTransaction(async (tx)=>{
      const doc = await tx.get(roomRef(code));
      const claimed = (doc.exists && doc.data().claimedRoles) || {};
      claimed[role] = true;
      tx.set(roomRef(code), { claimedRoles: claimed }, { merge: true });
    });
    saveSession();
    subscribeRoom(code);
    conn.status = 'waiting_partner';
    render();
  }catch(e){
    conn.status = 'error';
    conn.errorMsg = 'Nem sikerült létrehozni a szobát. Ellenőrizd az internetkapcsolatot.';
    render();
  }
}

async function joinRoomFirestore(code, role, autoSwitch){
  if(autoSwitch === undefined) autoSwitch = true;
  conn.mode = 'online'; conn.role = role; conn.roomCode = code;
  conn.status = 'connecting'; conn.errorMsg = null;
  render();
  try{
    await db.runTransaction(async (tx)=>{
      const doc = await tx.get(roomRef(code));
      if(!doc.exists){
        throw new Error('NO_ROOM');
      }
      const claimed = doc.data().claimedRoles || {};
      if(claimed[role]){
        throw new Error('ROLE_TAKEN');
      }
      claimed[role] = true;
      tx.set(roomRef(code), { claimedRoles: claimed }, { merge: true });
    });
    saveSession();
    subscribeRoom(code);
    conn.status = 'connected';
    render();
  }catch(e){
    if(e.message === 'ROLE_TAKEN' && autoSwitch){
      // Ne kérjünk újra kódot: próbáljuk meg automatikusan a másik csapatszínnel.
      const otherRole = role === 'blue' ? 'red' : 'blue';
      conn.autoSwitchNote = `A ${role==='blue' ? 'K\u00e9k' : 'Piros'} csapatot k\u00f6zben m\u00e1r valaki elfoglalta, ez\u00e9rt automatikusan a ${otherRole==='blue' ? 'K\u00e9k' : 'Piros'} csapatk\u00e9nt csatlakoztattunk.`;
      joinRoomFirestore(code, otherRole, false);
      return;
    }
    conn.status = 'error';
    conn.errorMsg = e.message === 'NO_ROOM'
      ? 'Nincs ilyen kódú szoba. Ellenőrizd, hogy a másik eszközön már létrehozták-e.'
      : e.message === 'ROLE_TAKEN'
        ? 'A szoba már teljes – mindkét csapatot elfoglalták.'
        : 'Nem sikerült csatlakozni. Ellenőrizd az internetkapcsolatot és a kódot.';
    render();
  }
}

// Élő ellenőrzés: amint a felhasználó beírja a 4 jegyű kódot, megnézzük, melyik
// szín már foglalt, hogy csak a szabadot lehessen kiválasztani (ütközés helyett).
let joinCheck = { code: null, blueTaken: false, redTaken: false, checked: false };
async function onJoinCodeInput(){
  const codeInput = document.getElementById('joinCodeInput');
  const code = (codeInput.value || '').trim();
  if(!/^\d{4}$/.test(code)){
    joinCheck = { code: null, blueTaken: false, redTaken: false, checked: false };
    updateJoinRoleUI();
    return;
  }
  if(!FIREBASE_AVAILABLE || !db) return;
  try{
    const doc = await roomRef(code).get();
    const claimed = (doc.exists && doc.data().claimedRoles) || {};
    joinCheck = { code, blueTaken: !!claimed.blue, redTaken: !!claimed.red, checked: true };
  }catch(e){
    joinCheck = { code, blueTaken: false, redTaken: false, checked: false };
  }
  updateJoinRoleUI();
}
function updateJoinRoleUI(){
  const codeInput = document.getElementById('joinCodeInput');
  const currentCode = codeInput ? (codeInput.value || '').trim() : null;
  if(!currentCode || currentCode !== joinCheck.code) return; // közben tovább írt, ne írjuk felül
  const blueRadio = document.getElementById('joinRoleBlue');
  const redRadio = document.getElementById('joinRoleRed');
  const blueLabel = document.getElementById('joinRoleBlueLabel');
  const redLabel = document.getElementById('joinRoleRedLabel');
  if(!blueRadio || !redRadio) return;
  blueRadio.disabled = joinCheck.blueTaken;
  redRadio.disabled = joinCheck.redTaken;
  if(blueLabel) blueLabel.textContent = 'Kék csapat' + (joinCheck.blueTaken ? ' (foglalt)' : '');
  if(redLabel) redLabel.textContent = 'Piros csapat' + (joinCheck.redTaken ? ' (foglalt)' : '');
  // Automatikusan a szabad csapatot jelöljük ki
  if(joinCheck.blueTaken && !joinCheck.redTaken){ redRadio.checked = true; }
  else if(joinCheck.redTaken && !joinCheck.blueTaken){ blueRadio.checked = true; }
}

async function resumeSessionFirestore(session){
  conn.mode = 'online'; conn.role = session.role; conn.roomCode = session.roomCode;
  conn.status = 'connecting'; conn.errorMsg = null;
  render();
  try{
    const doc = await roomRef(session.roomCode).get();
    if(!doc.exists){
      throw new Error('NO_ROOM');
    }
    subscribeRoom(session.roomCode);
    conn.status = 'connected';
    render();
  }catch(e){
    conn.status = 'error';
    conn.errorMsg = 'A korábbi szoba már nem érhető el.';
    clearSession();
    render();
  }
}

function leaveRoom(){
  if(conn.unsubscribe) conn.unsubscribe();
  // Felszabadítjuk a csapat-foglalást, hogy más újra elfoglalhassa (best-effort, nem várjuk meg)
  if(conn.mode === 'online' && conn.roomCode && conn.role){
    try{
      roomRef(conn.roomCode).set({ claimedRoles: { [conn.role]: firebase.firestore.FieldValue.delete() } }, { merge: true }).catch(()=>{});
    }catch(e){}
  }
  clearSession();
  conn = { mode:'local', role:null, roomCode:null, status:'idle', errorMsg:null, unsubscribe:null, partnerPresent:false };
}

// Melyik csapat a "cselekvő" fél az adott fázisban (ő húz/választ/pontoz épp)
function actingRole(){
  if(state.winner) return state.turn;
  if(['turn_start','color_choice','predict'].includes(state.phase)) return state.turn;
  if(['reveal','playing'].includes(state.phase)) return otherTeam(state.turn);
  return state.turn; // 'result' – bárki továbbléphet
}
// Ez az eszköz jogosult-e most cselekedni / látni a rejtett tartalmat
function iAmActing(){
  return conn.mode !== 'online' || !conn.role || conn.role === actingRole();
}
// Ez az eszköz a felolvasó csapaté-e (a kártyát csak ő láthatja reveal/playing alatt)
function iAmReader(){
  return conn.mode !== 'online' || !conn.role || conn.role === otherTeam(state.turn);
}

/* =========================================================
   ÁLLAPOT
   ========================================================= */
let state = null;

function freshState(){
  return {
    screen: 'connect', // connect | setup | game
    names: { blue: 'Kék csapat', red: 'Piros csapat' },
    mode: 'full', // 'full' | 'tracker'
    startTeam: 'blue',
    spiralRuleEnabled: true,
    timerDuration: 60,
    trackerTimerEnabled: false, // opcionális homokóra a pályakövető módhoz

    pos: { blue: 0, red: 0 },
    turn: 'blue',
    winner: null,
    log: [],

    // kör-fázis: turn_start | color_choice | predict | reveal | playing | result
    phase: 'turn_start',
    chosenColor: null,      // 'lila' | 'narancs'
    isQuestionTurn: false,
    predicted: null,
    revealed: false,
    currentCard: null,      // {topic, answers, checked:[..]}
    lastResult: null,       // {achieved, move, text}
    timerEndsAt: null,      // epoch ms – szinkronizált homokóra a több-eszközös módhoz
    rev: 0,                 // szinkron-verziószám (több-eszközös módhoz)

    decks: {
      lila: { order: shuffledIndices(TOPICS.lila.length), pointer: 0 },
      narancs: { order: shuffledIndices(TOPICS.narancs.length), pointer: 0 }
    }
  };
}


function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function teamName(t){ return state.names[t]; }
function otherTeam(t){ return t==='blue' ? 'red' : 'blue'; }

function addLog(text){
  state.log.unshift(text);
}

function cellLabel(cell){
  if(cell.type==='start') return 'Start mez\u0151';
  if(cell.type==='finish') return 'C\u00e9l mez\u0151';
  if(cell.type==='question') return 'K\u00e9rd\u0151jel mez\u0151';
  if(cell.type==='spiral') return 'Spir\u00e1l mez\u0151';
  return cell.color==='purple' ? 'Lila mez\u0151' : 'Narancs mez\u0151';
}

/* =========================================================
   PÁLYALOGIKA
   ========================================================= */
function applyMove(team, amount){
  const isForward = amount > 0;
  let pos = state.pos[team] + amount;
  if(pos >= TOTAL-1){
    state.pos[team] = TOTAL-1;
    state.winner = team;
    return;
  }
  if(pos < 0) pos = 0;
  state.pos[team] = pos;

  if(!isForward) return; // visszalépésnél nincs újabb mezőhatás

  const cell = TRACK[pos];
  if(cell.type === 'spiral' && state.spiralRuleEnabled){
    addLog(`${teamName(team)}: spir\u00e1l mez\u0151re \u00e9rkezett \u2192 a l\u00e9p\u00e9s (${amount}) meg ism\u00e9tl\u0151dik.`);
    applyMove(team, amount);
  }
}

/* =========================================================
   KÁRTYAHÚZÁS
   ========================================================= */
function drawCard(colorKey){ // 'lila' | 'narancs'
  const deck = state.decks[colorKey];
  if(deck.pointer >= deck.order.length){
    deck.order = shuffledIndices(TOPICS[colorKey].length);
    deck.pointer = 0;
    addLog(`\u00daj keverés t\u00f6rt\u00e9nt a ${colorKey === 'lila' ? 'lila' : 'narancss\u00e1rga'} pakliban.`);
  }
  const idx = deck.order[deck.pointer];
  deck.pointer++;
  const raw = TOPICS[colorKey][idx];
  return { topic: raw.topic, answers: raw.answers.slice(), checked: raw.answers.map(()=>false) };
}

/* =========================================================
   KÖR-FOLYAMAT (TELJES JÁTÉK MÓD)
   ========================================================= */
function beginTurn(){
  state.phase = 'turn_start';
  state.chosenColor = null;
  state.isQuestionTurn = false;
  state.predicted = null;
  state.revealed = false;
  state.currentCard = null;
  state.lastResult = null;
  render();
  persistState();
}

function startDraw(){
  const team = state.turn;
  const cell = TRACK[state.pos[team]];
  if(cell.type === 'normal'){
    state.chosenColor = cell.color === 'purple' ? 'lila' : 'narancs';
    state.isQuestionTurn = false;
    proceedToRevealOrPredict();
  } else if(cell.type === 'question'){
    state.isQuestionTurn = true;
    state.phase = 'color_choice';
  } else { // start vagy spirál mezőn állva (ritka eset)
    state.isQuestionTurn = false;
    state.phase = 'color_choice';
  }
  render();
  persistState();
}

function chooseColor(color){
  state.chosenColor = color;
  proceedToRevealOrPredict();
  render();
  persistState();
}

function proceedToRevealOrPredict(){
  if(state.isQuestionTurn){
    state.phase = 'predict';
  } else {
    state.currentCard = drawCard(state.chosenColor);
    state.phase = 'reveal';
    state.revealed = false;
  }
}

function submitPredict(){
  const val = parseInt(document.getElementById('predictInput').value, 10) || 0;
  state.predicted = Math.max(0, Math.min(10, val));
  state.currentCard = drawCard(state.chosenColor);
  state.phase = 'reveal';
  state.revealed = false;
  render();
  persistState();
}

function revealCard(){
  state.revealed = true;
  render();
  persistState();
}

function beginPlaying(){
  state.phase = 'playing';
  state.timerEndsAt = Date.now() + state.timerDuration*1000;
  render();
  persistState();
  resetTimer();
  startTimer(true);
}

function toggleAnswer(i){
  state.currentCard.checked[i] = !state.currentCard.checked[i];
  render();
  persistState();
}

function currentTally(){
  return state.currentCard.checked.filter(Boolean).length;
}

function endRound(){
  if(state.phase !== 'playing') return; // véletlen dupla-hívás elleni védelem (két eszköz esetén)
  stopTimer();
  const team = state.turn;
  const achieved = currentTally();
  let move, text;
  if(state.isQuestionTurn){
    if(achieved >= state.predicted){
      move = state.predicted;
      text = `Bemondott sz\u00e1m: ${state.predicted}. El\u00e9rt: ${achieved}/10 \u2192 teljes\u00edtve! ${move} mez\u0151t l\u00e9ptek el\u0151re.`;
    } else {
      move = -state.predicted;
      text = `Bemondott sz\u00e1m: ${state.predicted}. El\u00e9rt: ${achieved}/10 \u2192 nem siker\u00fclt. ${state.predicted} mez\u0151t l\u00e9ptek vissza.`;
    }
  } else {
    move = achieved;
    text = `El\u00e9rt v\u00e1laszok: ${achieved}/10 \u2192 ${achieved} mez\u0151t l\u00e9ptek el\u0151re.`;
  }
  addLog(`${teamName(team)}: ${text}`);
  applyMove(team, move);
  state.lastResult = { achieved, move, text };
  state.phase = 'result';
  state.timerEndsAt = null;
  render();
  persistState();
}

function nextTurn(){
  if(state.winner){
    render();
    persistState();
    return;
  }
  state.turn = otherTeam(state.turn);
  beginTurn();
}

/* =========================================================
   KÖR-FOLYAMAT (CSAK PÁLYA-KÖVETŐ MÓD)
   ========================================================= */
function trackerSubmitNormal(){
  const val = parseInt(document.getElementById('scoreInput').value, 10) || 0;
  const clamped = Math.max(0, Math.min(10, val));
  const team = state.turn;
  addLog(`${teamName(team)}: ${clamped} j\u00f3 v\u00e1lasz \u2192 ${clamped} mez\u0151t l\u00e9p.`);
  applyMove(team, clamped);
  trackerNextTurn();
}
function trackerSubmitPredict(){
  const val = parseInt(document.getElementById('predictInput2').value, 10) || 0;
  state.predicted = Math.max(0, Math.min(10, val));
  state.phase = 'tracker_resolve';
  render();
  persistState();
}
function trackerSubmitResolve(){
  const val = parseInt(document.getElementById('actualInput').value, 10) || 0;
  const actual = Math.max(0, Math.min(10, val));
  const team = state.turn;
  const predicted = state.predicted;
  if(actual >= predicted){
    addLog(`${teamName(team)}: bemondott ${predicted}-et, teljes\u00edtette (${actual}) \u2192 ${predicted} mez\u0151t l\u00e9p.`);
    applyMove(team, predicted);
  } else {
    addLog(`${teamName(team)}: bemondott ${predicted}-et, de csak ${actual} siker\u00fclt \u2192 ${predicted} mez\u0151t l\u00e9p vissza.`);
    applyMove(team, -predicted);
  }
  state.predicted = null;
  trackerNextTurn();
}
function trackerNextTurn(){
  if(state.winner){ render(); persistState(); return; }
  state.turn = otherTeam(state.turn);
  state.phase = 'turn_start';
  resetTimer();
  render();
  persistState();
}
function nudge(team, delta){
  let pos = state.pos[team] + delta;
  pos = Math.max(0, Math.min(TOTAL-1, pos));
  state.pos[team] = pos;
  addLog(`K\u00e9zi korrekci\u00f3: ${teamName(team)} \u2192 ${pos}. mez\u0151 (${cellLabel(TRACK[pos])}).`);
  render();
  persistState();
}

function trackerStartTimer(){
  resetTimer();
  state.timerEndsAt = Date.now() + state.timerDuration*1000;
  render();
  persistState();
  startTimer(false); // false: soha nem indít automatikus kör-lezárást, csak vizuális/hangjelzés
}
function trackerResetTimer(){
  resetTimer();
  render();
  persistState();
}

/* =========================================================
   HOMOKÓRA
   ========================================================= */
let timerInterval = null;
let warned30 = false, warned10 = false;

function computeRemaining(){
  if(!state.timerEndsAt) return state.timerDuration;
  return Math.max(0, Math.round((state.timerEndsAt - Date.now())/1000));
}
function resetTimer(){
  stopTimer();
  state.timerEndsAt = null;
  warned30 = false; warned10 = false;
  updateTimerDisplay();
}
function startTimer(autoMode){
  if(timerInterval) return;
  if(!state.timerEndsAt || computeRemaining() <= 0){
    state.timerEndsAt = Date.now() + state.timerDuration*1000;
  }
  warned30 = computeRemaining() <= 30;
  warned10 = computeRemaining() <= 10;
  timerInterval = setInterval(()=>{
    const remaining = computeRemaining();
    updateTimerDisplay();
    if(remaining <= 30 && !warned30){ warned30 = true; playWarningBeep(1); }
    if(remaining <= 10 && !warned10){ warned10 = true; playWarningBeep(2); }
    if(remaining <= 0){
      stopTimer();
      playBeep();
      if(autoMode && state.phase === 'playing' && iAmReader()){
        endRound();
      }
    }
  }, 250);
  updateStartBtn();
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  updateStartBtn();
}
function updateStartBtn(){
  const btn = document.getElementById('timerStartBtn');
  if(btn) btn.textContent = timerInterval ? 'Fut\u00f3ban\u2026' : '\u00d3ra ind\u00edt\u00e1sa';
}
function updateTimerDisplay(){
  const disp = document.getElementById('timerDisplay');
  if(!disp) return;
  const remaining = computeRemaining();
  const m = Math.floor(remaining/60);
  const s = remaining % 60;
  disp.textContent = m > 0 ? `${m}:${s.toString().padStart(2,'0')}` : `${s}`;
  disp.style.color = remaining <= 10 ? '#e5471f' : (remaining <= 30 ? '#f0b93d' : 'var(--gold-soft)');
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach((delay)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.value = 880; gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.15);
    });
  }catch(e){}
}
function playWarningBeep(count){
  // Rövid, halkabb, magasabb pittyenés(ek) a 30 mp / 10 mp jelzéshez, megkülönböztetve a záró szignáltól
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const delays = count === 2 ? [0, 0.16] : [0];
    delays.forEach((delay)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 1200; gain.gain.value = 0.10;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.1);
    });
  }catch(e){}
}

/* =========================================================
   BEÁLLÍTÁS KÉPERNYŐ
   ========================================================= */
function startGame(){
  const blueInput = document.getElementById('blueNameInput');
  const redInput = document.getElementById('redNameInput');
  const startSel = document.getElementById('setupStartTeam');
  const modeSel = document.querySelector('input[name="modeRadio"]:checked');
  const spiralChk = document.getElementById('setupSpiralToggle');
  const timerInput = document.getElementById('setupTimerDuration');
  const trackerTimerChk = document.getElementById('setupTrackerTimerToggle');

  state.names.blue = (blueInput.value || 'K\u00e9k csapat').trim();
  state.names.red = (redInput.value || 'Piros csapat').trim();
  state.startTeam = startSel.value;
  state.mode = modeSel ? modeSel.value : 'full';
  state.spiralRuleEnabled = spiralChk.checked;
  state.timerDuration = Math.max(5, Math.min(300, parseInt(timerInput.value,10) || 60));
  state.trackerTimerEnabled = trackerTimerChk ? trackerTimerChk.checked : false;

  state.pos = { blue:0, red:0 };
  state.turn = state.startTeam;
  state.winner = null;
  state.log = [];
  state.decks = {
    lila: { order: shuffledIndices(TOPICS.lila.length), pointer: 0 },
    narancs: { order: shuffledIndices(TOPICS.narancs.length), pointer: 0 }
  };
  state.screen = 'game';
  state.phase = 'turn_start';
  state.rev = 0;
  resetTimer();
  render();
  persistState();
}

function exitToMenu(){
  const isOnline = conn.mode === 'online';
  if(state.screen === 'game' && !state.winner && isOnline){
    // Online módban a kilépés felszabadítja a csapat-helyedet a szobában – erre érdemes figyelmeztetni.
    const ok = confirm('Biztosan kilépsz a menübe? Ez felszabadítja a csapat-helyedet ebben a szobában, a másik játékos ezt észlelni fogja.');
    if(!ok) return;
  }
  stopTimer();
  leaveRoom();
  // A helyi (egy eszközös) mentést NEM töröljük itt – a menüből visszatérve
  // fel fogjuk ajánlani a folytatást. Csak explicit "Nem, új játék" választásnál törlődik.
  const keepBlue = state.names ? state.names.blue : 'K\u00e9k csapat';
  const keepRed = state.names ? state.names.red : 'Piros csapat';
  state = freshState();
  state.names.blue = keepBlue; state.names.red = keepRed;
  state.screen = 'connect';
  render();
}

/* =========================================================
   KAPCSOLÓDÁSI KÉPERNYŐ (egy eszköz / két eszköz szobával)
   ========================================================= */
function chooseLocalMode(){
  leaveRoom();
  state.screen = 'setup';
  render();
}
function createRoom(){
  const roleSel = document.querySelector('input[name="hostRole"]:checked');
  const role = roleSel ? roleSel.value : 'blue';
  const code = generateRoomCode();
  state.screen = 'setup';
  createRoomFirestore(code, role);
}
function joinRoom(){
  const codeInput = document.getElementById('joinCodeInput');
  const roleSel = document.querySelector('input[name="joinRole"]:checked');
  const code = (codeInput.value || '').trim();
  if(!/^\d{4}$/.test(code)){
    conn.status = 'error';
    conn.errorMsg = 'A szoba kód 4 számjegyű legyen.';
    render();
    return;
  }
  const role = roleSel ? roleSel.value : 'blue';
  state.screen = 'joining';
  joinRoomFirestore(code, role);
}
function cancelJoin(){
  leaveRoom();
  state.screen = 'connect';
  render();
}
function resumePreviousSession(){
  const session = loadSession();
  if(!session) return;
  state.screen = 'joining';
  resumeSessionFirestore(session);
}
function declineResume(){
  clearSession();
  state.screen = 'connect';
  render();
}
function resumeLocalGame(){
  const saved = loadLocalGame();
  if(!saved) return;
  conn = { mode:'local', role:null, roomCode:null, status:'idle', errorMsg:null, unsubscribe:null, partnerPresent:false };
  state = saved;
  render();
  // Ha épp egy kör kellős közepén (idő fut) mentettük el, indítsuk újra a kijelzést
  if(state.screen === 'game'){
    if(state.mode === 'full' && state.phase === 'playing'){
      startTimer(true);
    } else if(state.mode === 'tracker' && state.trackerTimerEnabled && state.timerEndsAt && computeRemaining() > 0){
      startTimer(false);
    }
  }
}
function declineResumeLocal(){
  clearLocalGame();
  render();
}

  let inner = '';
  inner += `<circle cx="${CX}" cy="${CY}" r="${MAXR+18}" fill="#0a0d2c" stroke="#f0b93d" stroke-width="4"/>`;
  inner += `<circle cx="${CX}" cy="${CY}" r="${MINR-18}" fill="url(#centerGlow)"/>`;
  inner += `<path d="${buildSpiralPath()}" fill="none" stroke="#3a3f7a" stroke-width="14" stroke-linecap="round"/>`;
  TRACK.forEach((cell,i)=>{
    const p = cellPoint(i);
    const r = (cell.type==='start'||cell.type==='finish') ? 15 : 10.5;
    inner += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${r}" fill="${typeFill(cell)}" stroke="#0a0d2c" stroke-width="2.5"/>`;

      inner += `<text x="${p.x.toFixed(2)}" y="${(p.y+4).toFixed(2)}" text-anchor="middle" font-size="10" fill="#06303a">&#127744;</text>`;
    }

      inner += `<text x="${p.x.toFixed(2)}" y="${(p.y+24).toFixed(2)}" text-anchor="middle" font-size="10" font-weight="700" fill="#f0b93d" font-family="Arial">START</text>`;
    }

  const pawns = `

    <circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="15.5" fill="#000" opacity="0.35"/>
    <circle cx="${rx.toFixed(2)}" cy="${ry.toFixed(2)}" r="13" fill="#d1461f" stroke="#fff" stroke-width="3"/>
    <circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="13" fill="#2f6fed" stroke="#fff" stroke-width="3"/>
    <circle cx="${(rx-4).toFixed(2)}" cy="${(ry-4).toFixed(2)}" r="3.5" fill="#ffffff" opacity="0.65"/>
    <circle cx="${(bx-4).toFixed(2)}" cy="${(by-4).toFixed(2)}" r="3.5" fill="#ffffff" opacity="0.65"/>
  `;
  return defs + inner + pawns;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTurnStartControls(){
  const t = state.turn;
  const cell = TRACK[state.pos[t]];
  let cellDesc = '';
  if(cell.type === 'normal'){
    cellDesc = `A b\u00e1but ${cell.color==='purple' ? 'lila' : 'narancss\u00e1rga'} mez\u0151n \u00e1ll \u2192 ${cell.color==='purple' ? 'lila' : 'narancss\u00e1rga'} k\u00e1rty\u00e1t h\u00faztok.`;
  } else if(cell.type === 'question'){
    cellDesc = `A b\u00e1but k\u00e9rd\u0151jel mez\u0151n \u00e1ll \u2192 el\u0151re be kell mondanotok egy sz\u00e1mot, majd v\u00e1lasztotok sz\u00ednt.`;
  } else if(cell.type === 'spiral'){
    cellDesc = `A b\u00e1but spir\u00e1l mez\u0151n \u00e1ll \u2192 v\u00e1lasszatok sz\u00ednt.`;
  } else {
    cellDesc = `Start mez\u0151 \u2192 v\u00e1lasszatok sz\u00ednt.`;
  }
  return `
    <p class="hint">${cellDesc}</p>
    <button onclick="startDraw()">K\u00e1rtya h\u00faz\u00e1sa</button>
  `;
}

function renderPredict(){
  return `
    <p class="hint">A t\u00e9ma felolvas\u00e1sa el\u0151tt mondjatok be egy sz\u00e1mot: h\u00e1ny j\u00f3 v\u00e1laszt v\u00e1rtok?</p>

function renderReveal(){
  const reader = otherTeam(state.turn);
  if(!state.revealed){
    return `
      <div class="gate">
        <div class="big-warn">&#128065; Csak a FELOLVAS\u00d3 csapat n\u00e9zzen ide!</div>
        <p class="hint" style="margin:0 0 14px;">Felolvas\u00f3: <b>${esc(teamName(reader))}</b><br>
        ${esc(teamName(state.turn))} csapat forduljon el vagy ne n\u00e9zzen a k\u00e9perny\u0151re &ndash; nekik kell majd megfejteni!</p>
        <button onclick="revealCard()">Megn\u00e9zem a k\u00e1rty\u00e1t</button>
      </div>
    `;
  }
  const card = state.currentCard;
  return `
    <div class="hint">Felolvas\u00f3: <b>${esc(teamName(reader))}</b> &mdash; olvasd fel a t\u00e9m\u00e1t a ${esc(teamName(state.turn))} csapatnak, majd ind\u00edtsd az id\u0151t.</div>
    <div class="card-topic">${esc(card.topic)}</div>
    <button onclick="beginPlaying()">Id\u0151 ind\u00edt\u00e1sa (${state.timerDuration} mp)</button>
  `;
}

function renderPlaying(){
  const card = state.currentCard;
  const rows = card.answers.map((a,i)=>`
    <div class="answer-row ${card.checked[i] ? 'checked':''}" onclick="toggleAnswer(${i})">
      <div class="box">${card.checked[i] ? '&#10003;' : ''}</div>
      <span class="txt">${esc(a)}</span>
    </div>
  `).join('');
  return `
    <div id="timerWidget" style="margin-bottom:14px;">
      <div id="timerDisplay" style="text-align:center; font-family: Impact, 'Arial Black', sans-serif; font-size:48px; letter-spacing:2px; color:var(--gold-soft); line-height:1;">${state.timerDuration}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button onclick="startTimer(true)" id="timerStartBtn" style="margin:0;">\u00d3ra ind\u00edt\u00e1sa</button>
        <button class="secondary" onclick="resetTimer()" style="margin:0; width:auto; padding:12px 16px;">&#8635;</button>
      </div>
    </div>
    <div class="card-topic">${esc(card.topic)}</div>
    <div class="tally">${currentTally()} / 10</div>
    ${rows}
    <button class="danger" onclick="endRound()" style="margin-top:10px;">Befejez\u00e9s / id\u0151 lej\u00e1rt</button>
  `;
}

function renderResult(){
  const r = state.lastResult;
  const positive = r.move >= 0;
  const card = state.currentCard;
  const rows = card.answers.map((a,i)=>`
    <div class="answer-row ${card.checked[i] ? 'checked':'missed'}" style="cursor:default;">
      <div class="box ${card.checked[i] ? '' : 'missed-box'}">${card.checked[i] ? '&#10003;' : '&#10007;'}</div>
      <span class="txt">${esc(a)}</span>
    </div>
  `).join('');
  return `
    <div class="result-box ${positive ? 'win':'lose'}">
      <div class="big">${positive ? '+' : ''}${r.move} mez\u0151</div>
      <div>${esc(r.text)}</div>
    </div>
    <div class="card-topic">${esc(card.topic)}</div>
    <p class="hint" style="text-align:center;">A teljes lap most már mindkét csapat számára látható \u2014 zölddel az elhangzott, pirossal a kimaradt válaszok:</p>
    ${rows}
    <button onclick="nextTurn()" style="margin-top:12px;">${state.winner ? 'Eredm\u00e9ny megtekint\u00e9se' : 'K\u00f6vetkez\u0151 k\u00f6r'}</button>
  `;
}

function renderTrackerControls(){
  const t = state.turn;
  const timerWidget = state.trackerTimerEnabled ? `
    <div id="timerWidget" style="margin-bottom:14px;">
      <div id="timerDisplay" style="text-align:center; font-family: Impact, 'Arial Black', sans-serif; font-size:44px; letter-spacing:2px; color:var(--gold-soft); line-height:1;">${computeRemaining()}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button onclick="trackerStartTimer()" id="timerStartBtn" style="margin:0;">\u00d3ra ind\u00edt\u00e1sa</button>
        <button class="secondary" onclick="trackerResetTimer()" style="margin:0; width:auto; padding:12px 16px;">&#8635;</button>
      </div>
    </div>` : '';
  if(state.phase === 'turn_start'){
    const cell = TRACK[state.pos[t]];
    if(cell.type === 'question'){
      return timerWidget + `
        <p class="hint">A b\u00e1but k\u00e9rd\u0151jel mez\u0151n \u00e1ll &ndash; mondjatok be el\u0151re egy sz\u00e1mot a t\u00e9ma felolvas\u00e1sa el\u0151tt:</p>
        <input type="number" id="predictInput2" min="0" max="10" value="5">
        <button onclick="trackerSubmitPredict()">Sz\u00e1m r\u00f6gz\u00edt\u00e9se</button>
      `;
    }
    return timerWidget + `
      <p class="hint">H\u00e1ny j\u00f3 v\u00e1laszt adott a csapat ebben a k\u00f6rben?</p>
      <input type="number" id="scoreInput" min="0" max="10" value="0">
      <button onclick="trackerSubmitNormal()">L\u00e9p\u00e9s r\u00f6gz\u00edt\u00e9se</button>
    `;
  }
  if(state.phase === 'tracker_resolve'){
    return timerWidget + `
      <div class="hint">Bemondott sz\u00e1m: <b>${state.predicted}</b>. H\u00e1ny j\u00f3 v\u00e1laszt siker\u00fclt t\u00e9nylegesen adni?</div>
      <input type="number" id="actualInput" min="0" max="10" value="${state.predicted}">
      <button onclick="trackerSubmitResolve()">Ki\u00e9rt\u00e9kel\u00e9s</button>
    `;
  }
  return timerWidget;
}

function renderWaitingScreen(msg){
  return `
    <div class="gate" style="border-color: rgba(240,185,61,0.4); background: rgba(240,185,61,0.06);">
      <div class="big-warn" style="color:var(--gold-soft);">&#8987; V\u00e1rakoz\u00e1s\u2026</div>
      <p class="hint" style="margin:0;">${msg}</p>
    </div>
  `;
}

function renderGameScreen(){
  let controlsHtml = '';
  const online = conn.mode === 'online' && conn.role;
  if(!state.winner){
    if(state.mode === 'full'){
      const actorNeeded = ['turn_start','color_choice','predict'].includes(state.phase) ? state.turn
                         : ['reveal','playing'].includes(state.phase) ? otherTeam(state.turn)
                         : null;
      const iCanAct = !online || !actorNeeded || conn.role === actorNeeded;

      if(!iCanAct && (state.phase==='turn_start' || state.phase==='color_choice' || state.phase==='predict')){
        controlsHtml = renderWaitingScreen(`A ${esc(teamName(state.turn))} csapat éppen kártyát húz / választ. Türelem!`);
      } else if(!iCanAct && (state.phase==='reveal' || state.phase==='playing')){
        const reader = otherTeam(state.turn);
        controlsHtml = state.phase==='playing'
          ? `<div id="timerWidget" style="margin-bottom:14px;">
               <div id="timerDisplay" style="text-align:center; font-family: Impact, 'Arial Black', sans-serif; font-size:48px; letter-spacing:2px; color:var(--gold-soft); line-height:1;">${state.timerDuration}</div>
             </div>` + renderWaitingScreen(`A ${esc(teamName(reader))} csapat olvassa fel nektek a témát élőszóban. Figyeljétek az időt, és mondjátok a válaszokat!`)
          : renderWaitingScreen(`A ${esc(teamName(reader))} csapat mindjárt felolvassa nektek a témát élőszóban. Készüljetek!`);
      } else {
        if(state.phase==='turn_start') controlsHtml = renderTurnStartControls();
        else if(state.phase==='color_choice') controlsHtml = renderColorChoice();
        else if(state.phase==='predict') controlsHtml = renderPredict();
        else if(state.phase==='reveal') controlsHtml = renderReveal();
        else if(state.phase==='playing') controlsHtml = renderPlaying();
      }
      if(state.phase==='result') controlsHtml = renderResult(); // az eredményt mindkét eszköz látja
    } else {
      controlsHtml = renderTrackerControls();
    }
  }

  const winBanner = state.winner ? `<div class="win-banner">${esc(teamName(state.winner))} csapat nyert! &#127942;</div>` : '';
  const turnBanner = !state.winner ? `<div class="turn-banner ${state.turn}">${esc(teamName(state.turn))} csapat j\u00f6n</div>` : '';

  return `
  <div class="layout">
    <div class="board-card">
      <svg id="board" viewBox="0 0 600 600">${drawBoardSVG()}</svg>
    </div>
    <div>
      ${renderAutoSwitchBanner()}
      ${online ? `<p class="hint" style="text-align:center; margin-top:-8px;">Szoba: <b>${conn.roomCode}</b> &middot; Ez az eszköz: <b>${esc(teamName(conn.role))}</b></p>` : ''}      ${winBanner}
      <div class="panel" id="turnPanel" style="${state.winner?'display:none;':''}">
        <h2>Aktu\u00e1lis k\u00f6r</h2>
        ${turnBanner}
        <div id="turnControls">${controlsHtml}</div>
      </div>

      <div class="panel">
        <h2>Állás</h2>
        <div class="team-row blue">
          <div class="team-name"><span class="dot blue"></span>${esc(state.names.blue)}</div>
          <div class="team-pos">${state.pos.blue} / ${TOTAL-1}</div>
        </div>
        <div class="team-row red">
          <div class="team-name"><span class="dot red"></span>${esc(state.names.red)}</div>
          <div class="team-pos">${state.pos.red} / ${TOTAL-1}</div>
        </div>
        <details style="margin-top:10px;">
          <summary>Kézi korrekció</summary>
          <div class="correction-row">
            <button class="secondary" onclick="nudge('blue',-1)">&minus;</button>
            <span>${esc(state.names.blue)} pozíció</span>
            <button class="secondary" onclick="nudge('blue',1)">+</button>
          </div>
          <div class="correction-row">
            <button class="secondary" onclick="nudge('red',-1)">&minus;</button>
            <span>${esc(state.names.red)} pozíció</span>
            <button class="secondary" onclick="nudge('red',1)">+</button>
          </div>
        </details>
      </div>

      <div class="panel">
        <h2>Menet napló</h2>
        <div class="log">${state.log.map(l=>`<div>${l}</div>`).join('')}</div>
      </div>

      <div class="panel">
        <details>
          <summary>Szabályok / jelmagyarázat</summary>
          <div class="legend">
            <div class="legend-item"><span class="legend-swatch" style="background:var(--purple)"></span>Sima mező (lila)</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--orange)"></span>Sima mező (narancs)</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--cream)"></span>Kérdőjel mező</div>
            <div class="legend-item"><span class="legend-swatch" style="background:#2fb6c9"></span>Spirál mező</div>
          </div>
          <p style="margin-top:10px; line-height:1.5;">
          <b>Sima mező:</b> a kör végén annyit lép a csapat, ahány jó választ adott.<br><br>
          <b>Kérdőjel mező:</b> a bábu itt áll → előre be kell mondani egy számot. Ha teljesítik, pontosan annyit lépnek előre; ha nem, annyit lépnek vissza.<br><br>
          <b>Spirál mező:</b> pontos ráérkezéskor megismétlődik a lépés (kikapcsolható).<br><br>
          Aki eléri vagy túllépi a célt, nyer.
          </p>
        </details>
      </div>

      <button class="secondary" onclick="exitToMenu()">&#9664; Vissza a menübe / Új játék</button>
    </div>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  const navBar = document.getElementById('navBar');
  if(navBar) navBar.style.display = (state.screen === 'setup') ? 'block' : 'none';
  document.getElementById('subtitle').textContent = state.screen === 'connect'
    ? 'Digitális kártyahúzó, pálya-követő és pontozó'
    : state.screen === 'joining'
      ? 'Csatlakozás szobához\u2026'
      : state.screen === 'setup'
        ? (conn.mode === 'online' ? `Két eszközös mód \u2014 szoba: ${conn.roomCode}` : 'Egy eszközös mód')
        : (state.mode === 'full' ? 'Teljes játék mód' : 'Pálya-követő mód');
  if(state.screen === 'connect'){
    root.innerHTML = renderConnectScreen();
  } else if(state.screen === 'joining'){
    root.innerHTML = renderJoiningScreen();
  } else if(state.screen === 'setup'){
    root.innerHTML = renderSetupScreen();
  } else {
    root.innerHTML = renderGameScreen();
    if(state.mode === 'full' && state.phase !== 'playing' && timerInterval) stopTimer();
    if(state.mode === 'full' && state.phase === 'playing') updateTimerDisplay();
    if(state.mode === 'tracker' && state.trackerTimerEnabled) updateTimerDisplay();
  }
}

/* =========================================================
   INDÍTÁS
   ========================================================= */
state = freshState();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
